  /* =========================================================

  function normToPx(nx, ny) { return { x: CX + nx * R, y: CY + ny * R }; }
  function pxToNorm(px, py) { return { x: (px - CX) / R, y: (py - CY) / R }; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function quadrantColor(nx, ny) {
    // weighted blend of MOODS based on inverse squared distance
    let wr = 0, wg = 0, wb = 0, wsum = 0;
    for (const m of MOODS) {
      const dx = nx - m.x, dy = ny - m.y;
      const d2 = dx*dx + dy*dy + 0.05;
      const w = 1 / d2;
      wr += m.color[0] * w;
      wg += m.color[1] * w;
      wb += m.color[2] * w;
      wsum += w;
    }
    return [wr / wsum, wg / wsum, wb / wsum];
  }

  function proximityTo(m) {
    const n = pxToNorm(haloX, haloY);
    const d = Math.hypot(n.x - m.x, n.y - m.y);
    return clamp(1 - d / 1.3, 0, 1);

    for (const m of MOODS) {
      const v = proximityTo(m);
      if (v > best) best = v;
    }
    return Math.min(1, best * 1.15);
  }

  function dominantMood() {
    const n = pxToNorm(haloX, haloY);
    let best = null, bestD = Infinity;
    for (const m of MOODS) {
      const d = Math.hypot(n.x - m.x, n.y - m.y);
      if (d < bestD) { bestD = d; best = m; }
    }
    return { mood: best, dist: bestD };
  }

  /* =========================================================
   * RESIZE / SEEDING
   * ========================================================= */
  function resize() {
    const rect = circle.getBoundingClientRect();
    W = rect.width; H = rect.height;
    R = Math.min(W, H) / 2;
    CX = W / 2; CY = H / 2;

    for (const cv of [bgCanvas, pCanvas, sCanvas]) {
      cv.width = Math.floor(W * dpr);
      cv.height = Math.floor(H * dpr);
    }
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (starX === 0 && starY === 0) {
      starX = CX; starY = CY;
      targetX = CX; targetY = CY;
      haloX = CX; haloY = CY;
    }
    updateLabelGeometry();
    seedStars();
    drawBackground();
  }

  function updateLabelGeometry() {
    labelSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const labelR = R * PARAMS.typeArcRadius;
    const a = PARAMS.typeArcSpan;
    const fontSize = clamp(R * 0.075 * PARAMS.typeSize, 8, 80);
    for (const k in labels) {
      const { path, text, conf } = labels[k];
      const θ = conf.angle;
      const x1 = CX + labelR * Math.cos(θ - a);
      const y1 = CY + labelR * Math.sin(θ - a);
      const x2 = CX + labelR * Math.cos(θ + a);
      const y2 = CY + labelR * Math.sin(θ + a);
      // sweep-flag=1 (CW in SVG / increasing angle) — puts glyph tops outward
      path.setAttribute('d', `M ${x1} ${y1} A ${labelR} ${labelR} 0 0 1 ${x2} ${y2}`);
      text.setAttribute('font-size', fontSize);
    }
  }

  function applyTypography() {
    const fam = FONT_FAMILIES[typoFamilyIdx].stack;
    for (const k in labels) {
      const t = labels[k].text;
      t.style.fontFamily = fam;
      t.style.fontWeight = PARAMS.typeWeight;
      t.style.letterSpacing = PARAMS.typeSpacing + 'em';
      t.style.fontStyle = PARAMS.typeItalic >= 0.5 ? 'italic' : 'normal';
      t.style.strokeWidth = PARAMS.typeStroke + 'px';
      t.style.stroke = `rgba(5, 5, 15, ${PARAMS.typeStrokeAlpha})`;
    }
    updateLabelGeometry();
    // Reflect active family in button row (if present)
    document.querySelectorAll('#settings .type-family').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.idx) === typoFamilyIdx);
    });
  }

  function seedStars() {
    spaceStars = [];
    const n = Math.floor(PARAMS.starFieldDensity);
    for (let i = 0; i < n; i++) {
      let rx, ry;
      do {
        rx = Math.random() * 2 - 1;
        ry = Math.random() * 2 - 1;
      } while (rx*rx + ry*ry > 0.98);
      spaceStars.push({
        x: rx, y: ry,
        size: 0.5 + Math.random(),
        op: 0.08 + Math.random() * 0.17
      });
    }
    nebulae = [
      { x: -0.45, y: -0.35, r: 0.55, color: 'rgba(80,100,160,0.04)' },
      { x:  0.55, y:  0.35, r: 0.65, color: 'rgba(160,110,60,0.03)' },
      { x: -0.15, y:  0.55, r: 0.45, color: 'rgba(80,100,160,0.035)' },
    ];
  }

  function drawBackground() {
    bgCtx.clearRect(0, 0, W, H);

    for (const n of nebulae) {
      const p = normToPx(n.x, n.y);
      const rad = n.r * R;
      const g = bgCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
      g.addColorStop(0, n.color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      bgCtx.fillStyle = g;
      bgCtx.beginPath();
      bgCtx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      bgCtx.fill();
    }

    for (const s of spaceStars) {
      const p = normToPx(s.x, s.y);
      bgCtx.fillStyle = `rgba(255,255,255,${s.op})`;
      bgCtx.beginPath();
      bgCtx.arc(p.x, p.y, s.size, 0, Math.PI * 2);
      bgCtx.fill();
    }

    // distant sun
    {
      const p = normToPx(sunPos.x, sunPos.y);
      const g = bgCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 18);
      g.addColorStop(0, 'rgba(255,240,210,0.3)');
      g.addColorStop(0.3, 'rgba(255,230,190,0.12)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      bgCtx.fillStyle = g;
      bgCtx.beginPath();
      bgCtx.arc(p.x, p.y, 18, 0, Math.PI * 2);
      bgCtx.fill();
      bgCtx.fillStyle = 'rgba(255,245,220,0.8)';
      bgCtx.beginPath();
      bgCtx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      bgCtx.fill();
    }
    // faint crescent moon
    {
      const p = normToPx(moonPos.x, moonPos.y);
      bgCtx.save();
      bgCtx.strokeStyle = 'rgba(255,255,255,0.06)';
      bgCtx.lineWidth = 2;
      bgCtx.beginPath();
      bgCtx.arc(p.x, p.y, 20, Math.PI * 0.15, Math.PI * 1.15, false);
      bgCtx.stroke();
      bgCtx.restore();
    }
    // vignette
    if (PARAMS.vignette > 0) {
      const g = bgCtx.createRadialGradient(CX, CY, R * 0.5, CX, CY, R);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(0,0,0,${PARAMS.vignette})`);
      bgCtx.fillStyle = g;
      bgCtx.beginPath();
      bgCtx.arc(CX, CY, R, 0, Math.PI * 2);
      bgCtx.fill();
    }
  }

  /* =========================================================
   * PARTICLES — the living haze
   * ========================================================= */
  const particles = [];
  function emitParticle() {
    const bhR = PARAMS.bhSize;
    // spawn just outside event horizon in a tangential + outward mix
    const ang = Math.random() * Math.PI * 2;
    const spawnR = bhR * (1.05 + Math.random() * 0.4);
    const cos = Math.cos(ang), sin = Math.sin(ang);
    const px = CX + cos * spawnR;
    const py = CY + sin * spawnR;

    // outward velocity with jitter
    const speed = PARAMS.ejectionSpeed * (0.5 + Math.random());
    const jitter = PARAMS.ejectionJitter;
    let vx = cos * speed + (Math.random() - 0.5) * jitter;
    let vy = sin * speed + (Math.random() - 0.5) * jitter;
    // tangential kick for swirl
    vx += -sin * PARAMS.spin * 12;
    vy +=  cos * PARAMS.spin * 12;

    particles.push({
      x: px, y: py,
      vx, vy,
      born: performance.now(),
      life: PARAMS.particleLife * (0.7 + Math.random() * 0.6),
      size: PARAMS.particleSize * (0.6 + Math.random() * 0.8),
    });
    while (particles.length > PARAMS.maxParticles) particles.shift();
  }

  function updateAndDrawParticles(dt) {
    // Full clear every frame — no motion-blur residue on the dark background.
    pCtx.clearRect(0, 0, W, H);

    // Emission
    const emit = PARAMS.emissionRate;
    for (let i = 0; i < emit; i++) emitParticle();

    // Precompute dynamic color influences
    const haloNorm = pxToNorm(haloX, haloY);
    const cursorInfluenceColor = quadrantColor(haloNorm.x, haloNorm.y);
    const moodIntensity = nearestMoodIntensity();

    // Update + draw
    const now = performance.now();
    pCtx.save();
    pCtx.globalCompositeOperation = PARAMS.glowBlend > 0 ? 'lighter' : 'source-over';

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      const age = now - p.born;
      if (age > p.life) { particles.splice(i, 1); continue; }

      // Motion
      // black hole pull
      const dxc = CX - p.x, dyc = CY - p.y;
      const distc = Math.hypot(dxc, dyc) + 0.001;
      const pullStrength = PARAMS.bhPull * (PARAMS.bhSize * 1.2) / (distc + 10);
      p.vx += (dxc / distc) * pullStrength;
      p.vy += (dyc / distc) * pullStrength;

      // turbulence
      const t = PARAMS.turbulence;
      if (t > 0) {
        p.vx += (Math.random() - 0.5) * t;
        p.vy += (Math.random() - 0.5) * t;
      }

      // orbital spin around black hole
      if (PARAMS.spin !== 0) {
        const tangentX = -dyc / distc;
        const tangentY =  dxc / distc;
        p.vx += tangentX * PARAMS.spin * (1 - Math.min(1, distc / R));
        p.vy += tangentY * PARAMS.spin * (1 - Math.min(1, distc / R));
      }

      // cursor attraction/repulsion
      if (PARAMS.cursorAttract !== 0) {
        const dxh = haloX - p.x, dyh = haloY - p.y;
        const dh = Math.hypot(dxh, dyh) + 0.001;
        const f = PARAMS.cursorAttract * 40 / (dh + 40);
        p.vx += (dxh / dh) * f;
        p.vy += (dyh / dh) * f;
      }

      // drag
      p.vx *= (1 - PARAMS.drag);
      p.vy *= (1 - PARAMS.drag);

      p.x += p.vx;
      p.y += p.vy;

      // swallow if inside event horizon
      if (distc < PARAMS.bhSize * 0.95) { particles.splice(i, 1); continue; }

      // constrain to circle boundary — bounce softly
      const dcx = p.x - CX, dcy = p.y - CY;
      const dd = Math.hypot(dcx, dcy);
      if (dd > R - 2) {
        const k = (R - 2) / dd;
        p.x = CX + dcx * k;
        p.y = CY + dcy * k;
        // kill velocity slightly
        p.vx *= 0.3; p.vy *= 0.3;
      }

      // Color: quadrant color at particle position, mixed with white
      const nx = (p.x - CX) / R, ny = (p.y - CY) / R;
      const qc = quadrantColor(nx, ny);
      // cursor amplification — blend toward cursor quadrant color
      const ampMix = clamp(moodIntensity * PARAMS.cursorAmplify, 0, 1);
      let cr = lerp(qc[0], cursorInfluenceColor[0], ampMix);
      let cg = lerp(qc[1], cursorInfluenceColor[1], ampMix);
      let cb = lerp(qc[2], cursorInfluenceColor[2], ampMix);
      // neutral-white base → tint by moodTint
      const tintAmount = clamp(PARAMS.moodTint * (0.35 + moodIntensity * 0.85), 0, 1.5);
      cr = lerp(235, cr, clamp(tintAmount, 0, 1));
      cg = lerp(235, cg, clamp(tintAmount, 0, 1));
      cb = lerp(235, cb, clamp(tintAmount, 0, 1));
      // saturation boost
      if (PARAMS.saturation !== 1) {
        const mean = (cr + cg + cb) / 3;
        cr = clamp(mean + (cr - mean) * PARAMS.saturation, 0, 255);
        cg = clamp(mean + (cg - mean) * PARAMS.saturation, 0, 255);
        cb = clamp(mean + (cb - mean) * PARAMS.saturation, 0, 255);
      }

      // life curve: ramp in, ramp out
      const t01 = age / p.life;
      const env = Math.sin(t01 * Math.PI); // 0→1→0
      const alpha = env * PARAMS.hazeAlpha;

      // Cloud puff — large soft gradient, optional solid core weighted by softness.
      // High softness = pure haze puff, no core. Low softness = defined dot.
      const size = p.size;
      const puffR = size * PARAMS.cloudRadius;
      const softness = PARAMS.cloudSoftness;
      const rc = cr|0, gc = cg|0, bc = cb|0;

      // outer haze puff
      const g = pCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, puffR);
      const puffAlpha = alpha * (0.45 + PARAMS.glowBlend * 0.8);
      g.addColorStop(0,    `rgba(${rc},${gc},${bc},${puffAlpha})`);
      g.addColorStop(0.35, `rgba(${rc},${gc},${bc},${puffAlpha * 0.45})`);
      g.addColorStop(1,    `rgba(${rc},${gc},${bc},0)`);
      pCtx.fillStyle = g;
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, puffR, 0, Math.PI * 2);
      pCtx.fill();

      // faint inner condensation — fades away when softness is high
      const coreAlpha = alpha * (1 - softness) * 0.7;
      if (coreAlpha > 0.005) {
        pCtx.fillStyle = `rgba(${rc},${gc},${bc},${coreAlpha})`;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, size * (0.8 + (1 - softness) * 0.4), 0, Math.PI * 2);
        pCtx.fill();
      }
    }
    pCtx.restore();

    // Clip overflow to circle (mask)
    pCtx.save();
    pCtx.globalCompositeOperation = 'destination-in';
    pCtx.beginPath();
    pCtx.arc(CX, CY, R, 0, Math.PI * 2);
    pCtx.fillStyle = '#000';
    pCtx.fill();
    pCtx.restore();

    // --- Black hole on top of haze ---
    drawBlackHole();

    return { moodIntensity, haloNorm, cursorInfluenceColor };
  }

  function drawBlackHole() {
    const bhR = PARAMS.bhSize;
    const time = performance.now() / 1000;

    // Outer accretion glow — soft warm ring
    if (PARAMS.bhGlow > 0) {
      const glowR = bhR * (3.5 + Math.sin(time * 0.6) * 0.3 * PARAMS.bhWarp);
      const g = pCtx.createRadialGradient(CX, CY, bhR * 0.9, CX, CY, glowR);
      g.addColorStop(0, `rgba(255, 220, 180, ${0.55 * PARAMS.bhGlow})`);
      g.addColorStop(0.35, `rgba(255, 160, 90, ${0.25 * PARAMS.bhGlow})`);
      g.addColorStop(1, 'rgba(255, 120, 60, 0)');
      pCtx.save();
      pCtx.globalCompositeOperation = 'lighter';
      pCtx.fillStyle = g;
      pCtx.beginPath();
      pCtx.arc(CX, CY, glowR, 0, Math.PI * 2);
      pCtx.fill();
      pCtx.restore();
    }

    // Lensing ring — thin bright halo
    if (PARAMS.bhDistort > 0) {
      const lensR = bhR * (1.4 + Math.sin(time * 1.3) * 0.05 * PARAMS.bhWarp);
      pCtx.save();
      pCtx.globalCompositeOperation = 'lighter';
      pCtx.strokeStyle = `rgba(255, 240, 220, ${0.55 * PARAMS.bhDistort})`;
      pCtx.lineWidth = 1.5;
      pCtx.beginPath();
      pCtx.arc(CX, CY, lensR, 0, Math.PI * 2);
      pCtx.stroke();
      pCtx.restore();
    }

    // Event horizon — pure black disk
    pCtx.save();
    pCtx.fillStyle = '#000';
    pCtx.beginPath();
    pCtx.arc(CX, CY, bhR, 0, Math.PI * 2);
    pCtx.fill();
    // thin darker edge
    pCtx.strokeStyle = 'rgba(0,0,0,1)';
    pCtx.lineWidth = 1;
    pCtx.stroke();
    pCtx.restore();

    // Photon ring — razor thin bright ring at event horizon
    if (PARAMS.photonRing > 0) {
      pCtx.save();
      pCtx.globalCompositeOperation = 'lighter';
      const ringR = bhR * 1.06;
      const grad = pCtx.createRadialGradient(CX, CY, bhR * 0.98, CX, CY, bhR * 1.18);
      grad.addColorStop(0, 'rgba(255,240,220,0)');
      grad.addColorStop(0.5, `rgba(255,240,220,${0.9 * PARAMS.photonRing})`);
      grad.addColorStop(1, 'rgba(255,240,220,0)');
      pCtx.fillStyle = grad;
      pCtx.beginPath();
      pCtx.arc(CX, CY, bhR * 1.18, 0, Math.PI * 2);
      pCtx.fill();
      pCtx.restore();
    }
  }

  /* =========================================================
   * CURSOR STAR (cross + halo + comet tail)
   * ========================================================= */
  function drawStar(t, moodIntensity, haloColor) {
    sCtx.clearRect(0, 0, W, H);

    // Comet tail
    const now = performance.now();
    for (let i = tail.length - 1; i >= 0; i--) {
      const p = tail[i];
      const age = now - p.t;
      if (age > 600) { tail.splice(i, 1); continue; }
      const a = (1 - age / 600) * 0.6;
      sCtx.fillStyle = `rgba(255,255,255,${a})`;
      sCtx.beginPath();
      sCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      sCtx.fill();
    }

    const pulse = 1 + Math.sin(t / 1200) * 0.1;
    const rot = Math.sin(t / 1500) * (Math.PI / 180 * 3);

    // Halo (trailing, tinted by dominant mood)
    sCtx.save();
    sCtx.translate(haloX, haloY);
    const bloomR = 20 * pulse;
    const hr = haloColor ? haloColor[0] : 255;
    const hg = haloColor ? haloColor[1] : 255;
    const hb = haloColor ? haloColor[2] : 255;
    // blend halo color with white by intensity
    const mixA = clamp(moodIntensity * 1.5, 0, 1);
    const cr = lerp(255, hr, mixA) | 0;
    const cg = lerp(255, hg, mixA) | 0;
    const cb = lerp(255, hb, mixA) | 0;
    const g = sCtx.createRadialGradient(0, 0, 0, 0, 0, bloomR);
    g.addColorStop(0, `rgba(${cr},${cg},${cb},${0.9})`);
    g.addColorStop(0.3, `rgba(${cr},${cg},${cb},${0.35})`);
    g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    sCtx.fillStyle = g;
    sCtx.beginPath();
    sCtx.arc(0, 0, bloomR, 0, Math.PI * 2);
    sCtx.fill();
    sCtx.restore();

    // Cross
    sCtx.save();
    sCtx.translate(starX, starY);
    sCtx.rotate(rot);
    sCtx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const ang = (Math.PI / 4) + (i * Math.PI / 2);
      const rayLen = 60;
      const rg = sCtx.createLinearGradient(0, 0, Math.cos(ang)*rayLen, Math.sin(ang)*rayLen);
      rg.addColorStop(0, 'rgba(255,255,255,0.8)');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      sCtx.strokeStyle = rg;
      sCtx.beginPath();
      sCtx.moveTo(0, 0);
      sCtx.lineTo(Math.cos(ang)*rayLen, Math.sin(ang)*rayLen);
      sCtx.stroke();
    }
    sCtx.rotate(-rot);
    sCtx.fillStyle = 'rgba(255,255,255,1)';
    sCtx.beginPath();
    const points = 6, outer = 6, inner = 2.2;
    for (let i = 0; i < points * 2; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i === 0) sCtx.moveTo(x, y);
      else sCtx.lineTo(x, y);
    }
    sCtx.closePath();
    sCtx.fill();
    sCtx.fillStyle = 'rgba(255,255,255,1)';
    sCtx.beginPath();
    sCtx.arc(0, 0, 2, 0, Math.PI * 2);
    sCtx.fill();
    sCtx.restore();
  }

  /* =========================================================
   * LABEL / UI REACTIVITY
   * ========================================================= */
  function updateLabels(moodIntensity, t) {
    const maxGlow = PARAMS.labelGlowMax;
    const pulse = 0.8 + 0.2 * Math.sin((t || performance.now()) / 1100);
    const threshold = PARAMS.typeReveal;
    const sharp = Math.max(0.1, PARAMS.typeRevealSharp);
    // Letters stay predominantly white — color only tints at ~55% max so
    // "HAPPY" reads as a yellow-tinged white, not saturated yellow.
    const MAX_COLOR_MIX = 0.55;
    for (const m of MOODS) {
      const proximity = proximityTo(m);
      const raw = clamp((proximity - threshold) / Math.max(0.001, 1 - threshold), 0, 1);
      const p = Math.pow(raw, sharp);
      const el = labels[m.key].text;
      const [r, g, b] = m.color;
      if (p <= 0.001) {
        el.setAttribute('fill', 'rgba(255,255,255,0.14)');
        el.style.filter = 'none';
      } else {
        // Punchier ramp: tint reaches its cap early so the color reads clearly
        // instead of looking washed-out mid-range.
        const tint = Math.min(1, p * 1.6) * MAX_COLOR_MIX;
        const cr = Math.round(255 + (r - 255) * tint);
        const cg = Math.round(255 + (g - 255) * tint);
        const cb = Math.round(255 + (b - 255) * tint);
        const op = 0.28 + p * 0.72;
        el.setAttribute('fill', `rgba(${cr},${cg},${cb},${op})`);
        // Two-layer drop-shadow only — iOS Safari silently drops complex
        // filter chains on SVG text, which is why labels didn't glow on phone.
        const glow = p * maxGlow * pulse;
        el.style.filter =
          `drop-shadow(0 0 ${8  * glow}px rgba(${r},${g},${b},${Math.min(1, p * 1.1)})) ` +
          `drop-shadow(0 0 ${32 * glow}px rgba(${r},${g},${b},${p * 0.6}))`;
      }
    }
  }

  /* =========================================================
   * MAIN LOOP
   * ========================================================= */
  let lastX = 0, lastY = 0, lastT = performance.now();
  function animate(t) {
    const dt = t - lastT; lastT = t;

    starX = targetX; starY = targetY;
    haloX += (starX - haloX) * HALO_FOLLOW;
    haloY += (starY - haloY) * HALO_FOLLOW;

    const dx = starX - lastX, dy = starY - lastY;
    const speed = Math.hypot(dx, dy);
    const now = performance.now();
    if (speed > 0.5 && now - lastTailPush > 12) {
      const count = Math.min(4, 1 + Math.floor(speed / 8));
      for (let i = 0; i < count; i++) {
        const f = i / count;
        tail.push({
          x: lastX + dx * f + (Math.random() - 0.5) * 2,
          y: lastY + dy * f + (Math.random() - 0.5) * 2,
          r: 1 + Math.random(),
          t: now - f * 20
        });
      }
      while (tail.length > TAIL_MAX) tail.shift();
      lastTailPush = now;
    }
    lastX = starX; lastY = starY;

    const ctx = updateAndDrawParticles(dt);
    drawStar(t, ctx.moodIntensity, ctx.cursorInfluenceColor);
    updateLabels(ctx.moodIntensity, t);

    requestAnimationFrame(animate);
  }

  /* =========================================================
   * INPUT
   * ========================================================= */
  function constrainToCircle(x, y) {
    const dx = x - CX, dy = y - CY;
    const d = Math.hypot(dx, dy);
    const maxR = R - 2;
    if (d > maxR) {
      const k = maxR / d;
      return { x: CX + dx * k, y: CY + dy * k };
    }
    return { x, y };
  }
  let dragging = false;
  function pointerPos(e) {
    const rect = circle.getBoundingClientRect();
    let cx, cy;
    if (e.touches && e.touches.length) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    return { x: cx - rect.left, y: cy - rect.top };
  }
  function onDown(e) {
    dragging = true;
    const p = pointerPos(e);
    const c = constrainToCircle(p.x, p.y);
    targetX = c.x; targetY = c.y;
    if (e.cancelable) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const p = pointerPos(e);
    const c = constrainToCircle(p.x, p.y);
    targetX = c.x; targetY = c.y;
    if (e.cancelable) e.preventDefault();
  }
  function onUp() { dragging = false; }
  circle.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  circle.addEventListener('touchstart', onDown, { passive: false });
  circle.addEventListener('touchmove', onMove, { passive: false });
  circle.addEventListener('touchend', onUp);

  /* =========================================================
   * AUDIO ENGINE  (unchanged)
   * ========================================================= */
  const audioA = new Audio();
  const audioB = new Audio();
  for (const a of [audioA, audioB]) { a.preload = 'none'; a.volume = 0; }
  let currentEl = audioA, nextEl = audioB;
  let activeStream = null;
  let fadeRAF = null;
  const FADE_MS = 1400;
  const retryTimers = new WeakMap();

  function attachErrorHandler(el) {
    el.addEventListener('error', () => {
      const prev = retryTimers.get(el);
      if (prev) clearTimeout(prev);
      const t = setTimeout(() => {
        try { el.load(); el.play().catch(()=>{}); } catch (_) {}
      }, 3000);
      retryTimers.set(el, t);
    });
  }
  attachErrorHandler(audioA);
  attachErrorHandler(audioB);

  function setNowPlaying(_name) { /* UI removed — audio engine keeps tracking active stream internally */ }

  function startStream(stream, immediate) {
    let fadingOut = null, fadingIn;
    if (activeStream) {
      fadingOut = currentEl;
      fadingIn = nextEl;
      currentEl = nextEl;
      nextEl = fadingOut;
    } else {
      fadingIn = currentEl;
    }
    fadingIn.src = stream.url;
    try { fadingIn.load(); } catch (_) {}
    const playPromise = fadingIn.play();
    if (playPromise && playPromise.catch) playPromise.catch(() => {});

    if (immediate) {
      fadingIn.volume = 1;
      if (fadingOut) {
        fadingOut.volume = 0;
        try { fadingOut.pause(); fadingOut.removeAttribute('src'); fadingOut.load(); } catch(_) {}
      }
    } else {
      const startT = performance.now();
      const fromIn = fadingIn.volume;
      const fromOut = fadingOut ? fadingOut.volume : 0;
      if (fadeRAF) cancelAnimationFrame(fadeRAF);
      const step = (now) => {
        const k = Math.min(1, (now - startT) / FADE_MS);
        try {
          fadingIn.volume = Math.min(1, fromIn + (1 - fromIn) * k);
          if (fadingOut) fadingOut.volume = Math.max(0, fromOut * (1 - k));
        } catch(_) {}
        if (k < 1) fadeRAF = requestAnimationFrame(step);
        else {
          fadeRAF = null;
          if (fadingOut) {
            try { fadingOut.pause(); fadingOut.removeAttribute('src'); fadingOut.load(); } catch(_) {}
          }
        }
      };
      fadeRAF = requestAnimationFrame(step);
    }
    activeStream = stream;
    setNowPlaying(stream.name);
  }

  function nearestStream() {
    const n = pxToNorm(haloX, haloY);
    let best = null, bestD = Infinity;
    for (const s of STREAMS) {
      const d = (s.x - n.x) ** 2 + (s.y - n.y) ** 2;
      if (d < bestD) { bestD = d; best = s; }
    }
    return best;
  }

  setInterval(() => {
    if (!activeStream) return;
    const s = nearestStream();
    if (s && s !== activeStream) startStream(s, false);
  }, 200);

  function beginListening(e) {
    overlay.classList.add('hidden');
    overlay.removeEventListener('click', beginListening);
    overlay.removeEventListener('touchstart', beginListening);
    for (const el of [audioA, audioB]) {
      try {
        el.muted = true;
        const p = el.play();
        if (p && p.then) p.then(() => { try { el.pause(); el.muted = false; } catch(_) {} }).catch(() => { el.muted = false; });
        else { el.pause(); el.muted = false; }
      } catch(_) {}
    }
    startStream(STREAMS[0], true);
    if (e && e.cancelable) e.preventDefault();
  }
  overlay.addEventListener('click', beginListening);
  overlay.addEventListener('touchstart', beginListening, { passive: false });

  /* =========================================================
   * SETTINGS PANEL
   * ========================================================= */
  const settingsEl = document.getElementById('settings');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsClose = document.getElementById('settingsClose');
  const sliders = document.getElementById('sliders');

  function buildSliders() {
    let currentGroup = null;
    const frag = document.createDocumentFragment();
    for (const [group, key, label, min, max, step, def] of PARAMS_DEF) {
      if (group !== currentGroup) {
        currentGroup = group;
        const h = document.createElement('h3');
        h.textContent = group;
        frag.appendChild(h);
      }
      const row = document.createElement('div');
      row.className = 'row';
      const lbl = document.createElement('div');
      lbl.className = 'lbl';
      const name = document.createElement('span'); name.textContent = label;
      const val = document.createElement('span'); val.className = 'val';
      val.textContent = formatVal(PARAMS[key]);
      lbl.appendChild(name); lbl.appendChild(val);
      const input = document.createElement('input');
      input.type = 'range';
      input.min = min; input.max = max; input.step = step;
      input.value = PARAMS[key];
      input.dataset.key = key;
      input.addEventListener('input', () => {
        PARAMS[key] = parseFloat(input.value);
        val.textContent = formatVal(PARAMS[key]);
        if (key === 'starFieldDensity') { seedStars(); drawBackground(); }
        if (key === 'vignette') drawBackground();
        if (key.startsWith('type')) applyTypography();
      });
      row.appendChild(lbl); row.appendChild(input);
      frag.appendChild(row);
    }
    sliders.innerHTML = '';
    sliders.appendChild(frag);
  }
  function formatVal(v) {
    if (Math.abs(v) >= 100) return v.toFixed(0);
    if (Math.abs(v) >= 10) return v.toFixed(1);
    return v.toFixed(2);
  }
  function applyPreset(name) {
    // reset to defaults first
    for (const row of PARAMS_DEF) PARAMS[row[1]] = row[6];
    const p = PRESETS[name] || {};
    for (const k in p) PARAMS[k] = p[k];
    buildSliders();
    seedStars();
    drawBackground();
    applyTypography();
  }
  settingsBtn.addEventListener('click', () => settingsEl.classList.toggle('open'));
  settingsClose.addEventListener('click', () => settingsEl.classList.remove('open'));
  document.querySelectorAll('#settings .preset').forEach(btn => {
    btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
  });

  /* --- Persistence: save/load/clear with fallback for blocked storage.
   * localStorage throws on file:// origins in Chrome, in sandboxed
   * iframes, and in strict private-browsing modes. We wrap it with an
   * in-memory fallback so save/load still work within the session, and
   * download-as-JSON so settings can always be exported.                 */
  const STORAGE_KEY = 'frontal_params_v1';
  const saveStatus = document.getElementById('saveStatus');

  const storage = (() => {
    try {
      const k = '__frontal_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return { get: k => window.localStorage.getItem(k),
               set: (k,v) => window.localStorage.setItem(k,v),
               del: k => window.localStorage.removeItem(k),
               persistent: true };
    } catch (e) {
      const mem = {};
      return { get: k => mem[k] ?? null,
               set: (k,v) => { mem[k] = v; },
               del: k => { delete mem[k]; },
               persistent: false };
    }
  })();

  function flashStatus(msg, color) {
    saveStatus.textContent = msg;
    saveStatus.style.color = color || 'rgba(140,220,180,0.9)';
    saveStatus.classList.add('show');
    clearTimeout(flashStatus._t);
    flashStatus._t = setTimeout(() => saveStatus.classList.remove('show'), 1600);
  }
  function saveParams() {
    try {
      const payload = { params: PARAMS, typoFamilyIdx };
      storage.set(STORAGE_KEY, JSON.stringify(payload));
      flashStatus(storage.persistent ? 'SAVED' : 'SAVED (session only)',
                  storage.persistent ? null : 'rgba(200,180,140,0.9)');
    } catch (e) {
      flashStatus('SAVE FAILED: ' + (e && e.message ? e.message.slice(0,40) : 'unknown'),
                  'rgba(240,120,120,0.9)');
      console.error('[FRONTAL] save error:', e);
    }
  }
  function loadParams(silent) {
    try {
      const s = storage.get(STORAGE_KEY);
      if (!s) { if (!silent) flashStatus('NOTHING SAVED', 'rgba(200,180,140,0.9)'); return false; }
      const obj = JSON.parse(s);
      // Support both new payload shape and legacy bare-params shape
      const params = obj.params || obj;
      for (const k in params) if (k in PARAMS) PARAMS[k] = params[k];
      if (typeof obj.typoFamilyIdx === 'number') typoFamilyIdx = obj.typoFamilyIdx;
      if (!silent) flashStatus('LOADED');
      return true;
    } catch (e) {
      if (!silent) flashStatus('LOAD FAILED', 'rgba(240,120,120,0.9)');
      console.error('[FRONTAL] load error:', e);
      return false;
    }
  }
  function clearParams() {
    try {
      storage.del(STORAGE_KEY);
      for (const row of PARAMS_DEF) PARAMS[row[1]] = row[6];
      typoFamilyIdx = 0;
      buildSliders();
      seedStars(); drawBackground();
      applyTypography();
      flashStatus('CLEARED', 'rgba(200,180,140,0.9)');
    } catch (e) {
      flashStatus('CLEAR FAILED', 'rgba(240,120,120,0.9)');
    }
  }
  // Export current params as a downloadable JSON file — always works.
  function exportParams() {
    try {
      const blob = new Blob([JSON.stringify(PARAMS, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'frontal-params.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      flashStatus('DOWNLOADED');
    } catch (e) {
      flashStatus('EXPORT FAILED', 'rgba(240,120,120,0.9)');
    }
  }
  document.getElementById('saveBtn').addEventListener('click', saveParams);
  document.getElementById('loadBtn').addEventListener('click', () => {
    if (loadParams()) { buildSliders(); seedStars(); drawBackground(); applyTypography(); }
  });
  document.getElementById('exportBtn').addEventListener('click', exportParams);
  document.getElementById('clearBtn').addEventListener('click', clearParams);

  // Auto-load saved tuning on startup (silent if nothing stored)
  loadParams(true);
  buildSliders();

  // Typography family buttons
  (function buildFamilyButtons() {
    const host = document.getElementById('typeFamilies');
    host.innerHTML = '';
    FONT_FAMILIES.forEach((f, i) => {
      const b = document.createElement('button');
      b.className = 'preset type-family';
      b.dataset.idx = i;
      b.textContent = f.label;
      b.addEventListener('click', () => { typoFamilyIdx = i; applyTypography(); });
      host.appendChild(b);
    });
  })();
  applyTypography();

  /* =========================================================
   * INIT
   * ========================================================= */
  window.addEventListener('resize', resize);
  resize();
  lastX = starX; lastY = starY;
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
